# OpenBao Helm values (chart openbao-helm 0.30.x, OpenBao 2.7.x).
#
# Production shape, laptop size: integrated Raft storage in HA mode, but with
# 1 replica instead of 3. Going to 3 is a replicas change, not a redesign.

global:
  # Lab only. In production enable TLS (cert-manager issues the cert) and set
  # tlsDisable: false plus the tls_* listener options below.
  tlsDisable: true

# The agent injector (sidecar that writes secrets into pod files) is one way to
# deliver secrets. We use External Secrets Operator instead; see
# docs/03-openbao-how-it-works.md for the trade-off.
injector:
  enabled: false

server:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

  dataStorage:
    enabled: true
    size: 1Gi

  # Secrets created by OpenTofu (infra/stacks/10-bootstrap) before Argo CD
  # installs this chart. Only these two values are not in Git.
  extraSecretEnvironmentVars:
    - envName: BAO_STATIC_UNSEAL_KEY
      secretName: openbao-seal
      secretKey: BAO_STATIC_UNSEAL_KEY
    - envName: INITIAL_ADMIN_PASSWORD
      secretName: openbao-bootstrap-admin
      secretKey: INITIAL_ADMIN_PASSWORD

  service:
    type: NodePort
    nodePort: 30820 # mapped to http://localhost:48200 by the kind cluster

  ha:
    enabled: true
    replicas: 1 # 3 (or 5) in production, spread across zones
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable     = 1
          address         = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/openbao/data"

          # With 3 replicas, each pod finds its peers through the headless
          # service. Harmless with 1 replica.
          retry_join {
            leader_api_addr = "http://openbao-0.openbao-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://openbao-1.openbao-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://openbao-2.openbao-internal:8200"
          }
        }

        service_registration "kubernetes" {}

        # Auto-unseal. OpenBao encrypts its root key with this key, so a
        # restarted pod unseals itself without a human typing unseal shares.
        # "static" reads the key from an env var; production uses a KMS:
        #   seal "awskms" { region = "eu-west-1"  kms_key_id = "alias/openbao" }
        seal "static" {
          current_key_id = "lab-2026-10"
          current_key    = "env://BAO_STATIC_UNSEAL_KEY"
        }

        # Declarative audit device: every request and response is logged
        # (secrets HMAC'd) to stdout, where your log pipeline picks it up.
        audit "file" "stdout" {
          description = "Audit log to container stdout"
          options {
            file_path = "stdout"
          }
        }

        # Declarative self-initialization (OpenBao-only feature). Runs exactly
        # once, on first start with empty storage. No root token is ever handed
        # out: it is used for these requests and then revoked.
        #
        # We create only what OpenTofu needs to take over (stack 20):
        #   - a platform-admin policy and a tofu-admin login
        #   - a transit key OpenTofu uses to encrypt its own state
        initialize "admin" {
          request "admin-policy" {
            operation = "update"
            path      = "sys/policies/acl/platform-admin"
            data = {
              policy = "path \"*\" { capabilities = [\"create\", \"read\", \"update\", \"patch\", \"delete\", \"list\", \"sudo\"] }"
            }
          }
          request "enable-userpass" {
            operation = "update"
            path      = "sys/auth/userpass"
            data      = { type = "userpass" }
          }
          request "create-tofu-admin" {
            operation = "update"
            path      = "auth/userpass/users/tofu-admin"
            data = {
              password = {
                eval_type       = "string"
                eval_source     = "env"
                env_var         = "INITIAL_ADMIN_PASSWORD"
                require_present = true
              }
              token_policies = ["platform-admin"]
              token_ttl      = "1h"
              token_max_ttl  = "4h"
            }
          }
        }

        initialize "state-encryption" {
          request "enable-transit" {
            operation = "update"
            path      = "sys/mounts/transit"
            data      = { type = "transit" }
          }
          request "tofu-state-key" {
            operation = "update"
            path      = "transit/keys/tofu-state"
            data      = { type = "aes256-gcm96" }
          }
        }

ui:
  enabled: true
