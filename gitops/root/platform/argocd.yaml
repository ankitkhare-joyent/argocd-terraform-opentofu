# Argo CD managing Argo CD. OpenTofu installed the first copy; from now on an
# upgrade is a one-line change to targetRevision below, reviewed in a PR.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  # Multiple sources: the chart comes from the upstream Helm repo, the values
  # come from our Git repo ($values refers to the second source).
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.9.6 # Argo CD v3.5.x
      helm:
        releaseName: argocd
        valueFiles:
          - $values/gitops/platform/argocd/values.yaml
    - repoURL: http://gitea:3000/platform/platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true # Argo CD's own CRDs are too large for client-side apply annotations
