# Desired state: "a Secret named demo-db holding the keys stored at
# secret/apps/demo/<env> in OpenBao". ESO creates and refreshes it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-db
  annotations:
    # The Secret must exist before the Deployment (wave 0) starts pods.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1m # how quickly a rotation in OpenBao reaches the pod
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: demo-db
    creationPolicy: Owner # deleting the ExternalSecret deletes the Secret
  dataFrom:
    - extract:
        key: REPLACED_BY_OVERLAY
