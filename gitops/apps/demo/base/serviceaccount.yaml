# Identity used ONLY to authenticate to OpenBao. The app pods do not use it,
# and OpenBao's role for this env is bound to this exact name + namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-reader
  annotations:
    # Identity and store first, then the secret, then the pods that need it.
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
