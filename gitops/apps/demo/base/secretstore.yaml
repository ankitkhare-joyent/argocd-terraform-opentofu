# Namespaced SecretStore: this namespace's door into OpenBao.
#
# ESO asks Kubernetes for a short-lived token for the openbao-reader
# ServiceAccount, logs in to OpenBao's kubernetes auth method with it, and gets
# back an OpenBao token limited to this environment's policy. A dev namespace
# therefore cannot read prod secrets even if someone edits the ExternalSecret.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  annotations:
    # Must be Ready before the ExternalSecret can sync.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    vault: # OpenBao is API-compatible with Vault, so ESO's vault provider is used
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: REPLACED_BY_OVERLAY
          serviceAccountRef:
            name: openbao-reader
